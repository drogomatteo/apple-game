site_name: AppleGame Documentation
site_description: Documentation complète du projet AppleGame - Jeu pour Alzheimer
site_author: Équipe AppleGame (Eva Kabelis, Tom Boreux, Matteo Drogo, Martin Lempite)
site_url: https://apple-game-docs.example.com

# Configuration
theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

